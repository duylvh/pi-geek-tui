name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Tag v<version> and create the GitHub release (main only; needs a CHANGELOG.md section for the version)
        type: boolean
        default: false
      registry_check:
        description: Install the published npm package at this version and check its manifest
        type: boolean
        default: false

permissions:
  contents: read

# A push never cancels a dispatched (release) run, and dispatched runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to actions/setup-node v4.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=critical

  install-registry:
    if: github.event_name == 'workflow_dispatch' && inputs.registry_check == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Pinned to actions/setup-node v4.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install published package from npm registry
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          npm install "$name@$version" --no-audit --no-fund --ignore-scripts
          PKG_DIR="$dir/node_modules/$name" node - "$name" "$version" <<'JS'
          const fs = require("fs");
          const path = require("path");
          const [name, version] = process.argv.slice(2);
          const root = process.env.PKG_DIR;
          const m = require(path.join(root, "package.json"));
          if (m.name !== name) throw new Error(`name mismatch: ${m.name}`);
          if (m.version !== version) throw new Error(`version mismatch: ${m.version}`);
          const ext = m.pi && m.pi.extensions;
          if (!Array.isArray(ext) || ext.length === 0) throw new Error("pi.extensions invalid");
          for (const e of ext) {
            if (typeof e !== "string" || !e.startsWith("./")) throw new Error(`extension entry must be relative: ${e}`);
            const p = path.resolve(root, e);
            if (!(p === root || p.startsWith(root + path.sep))) throw new Error(`extension escapes package root: ${e}`);
            if (!fs.existsSync(p)) throw new Error(`extension file missing: ${e}`);
          }
          const img = m.pi && m.pi.image;
          if (typeof img !== "string" || !/^https:\/\//.test(img)) throw new Error("pi.image must be an https URL");
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "pi-image-url"), img);
          console.log("registry install ok:", `${m.name}@${m.version}`, "| extensions:", JSON.stringify(ext), "| image:", img);
          JS
      - name: Check pi.image is reachable
        run: |
          set -euo pipefail
          img="$(cat "$RUNNER_TEMP/pi-image-url")"
          curl --fail --silent --show-error --location --head --output /dev/null "$img" || {
            echo "pi.image is not reachable: $img" >&2
            exit 1
          }
          echo "pi.image ok: $img"

  release:
    # Only an explicit dispatch releases; the main-branch guard below fails loudly instead of skipping.
    if: github.event_name == 'workflow_dispatch' && inputs.release == true
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "Releases are cut from main only (this run is on $GITHUB_REF)." >&2
            exit 1
          }
      # Pinned to actions/checkout v4.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Tag version and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid package version: $version" >&2
            exit 1
          }
          tag="v$version"
          title="${name##*/} $tag"

          # Release notes = the body of the `## <version>` section (up to the next `## ` heading).
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$version" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found { print }' CHANGELOG.md > "$notes"
          grep -q '[^[:space:]]' "$notes" || {
            echo "CHANGELOG.md has no (or an empty) '## $version' section: add one before releasing." >&2
            exit 1
          }

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists on origin: bump the version in package.json (and CHANGELOG.md) before releasing." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A GitHub release named $tag already exists: bump the version before releasing." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$title"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --title "$title" --notes-file "$notes"
